<!DOCTYPE html>
<html lang="en">



<head>
	<meta charset="utf-8">
	<title>Login</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">

	<!-- Favicons -->
	<link href="assets/img/favicon.png" rel="icon">
	<link rel="stylesheet" href="assets/css/ChatbotCss.css" />
	<link rel="stylesheet" href="assets/css/HomePage.css" />
	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">

	<!-- Fontawesome CSS -->
	<link rel="stylesheet" href="assets/plugins/fontawesome/css/fontawesome.min.css">
	<link rel="stylesheet" href="assets/plugins/fontawesome/css/all.min.css">

	<!-- Main CSS -->
	<link rel="stylesheet" href="assets/css/style.css">



</head>
<br><br><br><br><br><br><br><br>

<body class="account-page">

	<!-- Main Wrapper -->
	<div class="main-wrapper">

		<!-- Header -->
		<header class="header">
			<div class="logo">
				<a href="/homepage">
					<img src="assets/img/AI_logo.png" alt="Ayurvedic AI" height="60px" width="60px">
				</a>
			</div>

        <link href="assets/css/MainCss.css" rel="stylesheet">

        <nav class="space-x-6 text-gray-700 font-medium" style="font-size: medium;">
            <a href="/homepage" class="hover:text-green-600">Home</a>
            <a href="/yoga" class="hover:text-green-600">Yoga</a>
            <a href="/meditation" class="hover:text-green-600">Meditation</a>
            <a href="/diet" class="hover:text-green-600">Diet</a>
            <a href="/identify" class="hover:text-green-600">Plant Identify</a>
            <a href="/chatbot" class="hover:text-green-600">Chatbot</a>
            <a href="/logout"
                class="inline-block bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition"
                style="background-color: hsl(0, 94%, 66%);">Log In</a>


        </nav>

			<div class="fas fa-bars" id="menu-btn"></div>
		</header>
		<!-- /Header -->

		<!-- Page Content -->
		<div class="content">
			<div class="container-fluid">

				<div class="row">
					<div class="col-md-8 offset-md-2">

						<!-- Login Tab Content -->
						<form method="POST"></form>
						<div class="account-content">
							<div class="row align-items-center justify-content-center">
								<div class="col-md-7 col-lg-6 login-left">
									<img src="assets/img/login-banner.png" class="img-fluid" alt="Login">
								</div>
								<div class="col-md-12 col-lg-6 login-right">
									<div class="login-header">
										<h3>Login <span>Ayurvedic Intelligence</span></h3>
									</div>
									<form action="{{ url_for('login.login') }}" method="POST">
										<div class="form-group form-focus">
											<input type="text" name="email" class="form-control floating" required>
											<label class="focus-label">Email</label>
										</div>
										<div class="form-group form-focus">
											<input type="password" name="password" class="form-control floating"
												required>
											<label class="focus-label">Password</label>
										</div>
										<div class="text-right">
											<a class="forgot-link" href=" ">Forgot Password ?</a>
										</div>
										<button class="btn btn-primary btn-block btn-lg login-btn"
											type="submit">Login</button>


										<div class="text-center dont-have">Don’t have an account? <a
												href="/signup">Register</a></div>
									</form>
								</div>
							</div>
						</div>
						</form>
						<!-- /Login Tab Content -->

					</div>
				</div>

			</div>

		</div>
		<!-- /Page Content -->

		<!-- footer section starts  -->
		<style>
			.footerDoc .credits {
				padding: 1rem;
				padding-top: 2rem;
				margin-top: 2rem;
				text-align: center;
				font-size: 2rem;
				color: #000;
				border-top: .1rem solid rgba(0, 0, 0, .1);
			}


			.footerDoc .credits span {
				color: var(--Soft-Red);
				cursor: pointer;
			}
		</style>
		<section class="footerDoc" id="footerDoc">
			<div class="credits">Created by <span>Ayurvedic AI Team</span> | All rights reserved</div>
		</section>
		<!-- footer section ends -->

	</div>
	<!-- /Main Wrapper -->

	<!-- jQuery -->
	<script src="assets/js/jquery.min.js"></script>

	<!-- Bootstrap Core JS -->
	<script src="assets/js/popper.min.js"></script>
	<script src="assets/js/bootstrap.min.js"></script>

	<!-- Custom JS -->
	<script src="assets/js/script.js"></script>

</body>



</html>
