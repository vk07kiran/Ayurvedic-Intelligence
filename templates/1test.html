<!DOCTYPE html>
<html>
<head><title>Doctor Profile</title></head>
<body>
    <h2>{{ 'Update' if doctor else 'Add' }} Doctor Profile</h2>
    <form action="/submit" method="POST">
        <input type="hidden" name="DoctorID" value="{{ doctor.DoctorID if doctor else 0 }}">

        <label>Username: <input name="DoctorUsename" value="{{ doctor.DoctorUsename if doctor else '' }}"></label><br>
        <label>Email: <input name="DoctorEmail" type="email" value="{{ doctor.DoctorEmail if doctor else '' }}"></label><br>
        <label>First Name: <input name="DoctorFirstName" value="{{ doctor.DoctorFirstName if doctor else '' }}"></label><br>
        <label>Last Name: <input name="DoctorLastName" value="{{ doctor.DoctorLastName if doctor else '' }}"></label><br>
        <label>Password: <input name="DoctorPassword" type="password" required></label><br>
        <label>Phone: <input name="DoctorPhone" value="{{ doctor.DoctorPhone if doctor else '' }}"></label><br>
        <label>Gender: <input name="DoctorGender" value="{{ doctor.DoctorGender if doctor else '' }}"></label><br>
        <label>DOB: <input name="DoctorDOB" type="date" value="{{ doctor.DoctorDOB if doctor else '' }}"></label><br>
        <label>Bio: <textarea name="DoctorBio">{{ doctor.DoctorBio if doctor else '' }}</textarea></label><br>
        <label>Clinic Name: <input name="DoctorClinicName" value="{{ doctor.DoctorClinicName if doctor else '' }}"></label><br>
        <label>Clinic Address: <input name="DoctorClinicAddress" value="{{ doctor.DoctorClinicAddress if doctor else '' }}"></label><br>
        <label>Profile Pic URL: <input name="DoctorProfilePic" value="{{ doctor.DoctorProfilePic if doctor else '' }}"></label><br>
        <label>Images: <input name="DoctorImages" value="{{ doctor.DoctorImages if doctor else '' }}"></label><br>
        <label>Address1: <input name="DoctorAddress1" value="{{ doctor.DoctorAddress1 if doctor else '' }}"></label><br>
        <label>Address2: <input name="DoctorAddress2" value="{{ doctor.DoctorAddress2 if doctor else '' }}"></label><br>
        <label>City: <input name="DoctorCity" value="{{ doctor.DoctorCity if doctor else '' }}"></label><br>
        <label>State: <input name="DoctorState" value="{{ doctor.DoctorState if doctor else '' }}"></label><br>
        <label>Country: <input name="DoctorCountry" value="{{ doctor.DoctorCountry if doctor else '' }}"></label><br>
        <label>Postal Code: <input name="DoctorPostalCode" value="{{ doctor.DoctorPostalCode if doctor else '' }}"></label><br>
        <label>Fee Per Hour: <input name="DoctorFeePerHour" value="{{ doctor.DoctorFeePerHour if doctor else '' }}"></label><br>
        <label>Specialization: <input name="DoctorSpecialization" value="{{ doctor.DoctorSpecialization if doctor else '' }}"></label><br>
        <label>Services: <input name="DoctorServices" value="{{ doctor.DoctorServices if doctor else '' }}"></label><br>
        <label>Degree Name: <input name="DoctorDegreeName" value="{{ doctor.DoctorDegreeName if doctor else '' }}"></label><br>
        <label>College: <input name="DoctorCollege" value="{{ doctor.DoctorCollege if doctor else '' }}"></label><br>
        <label>Year of Completion: <input name="DoctorYearOfCompletion" value="{{ doctor.DoctorYearOfCompletion if doctor else '' }}"></label><br>
        <label>Experience Hospital: <input name="DoctorExperienceHospital" value="{{ doctor.DoctorExperienceHospital if doctor else '' }}"></label><br>
        <label>Experience From: <input name="DoctorExperienceFromYear" value="{{ doctor.DoctorExperienceFromYear if doctor else '' }}"></label><br>
        <label>Experience To: <input name="DoctorExperienceToYear" value="{{ doctor.DoctorExperienceToYear if doctor else '' }}"></label><br>
        <label>Designation: <input name="DoctorExperienceDesignation" value="{{ doctor.DoctorExperienceDesignation if doctor else '' }}"></label><br>
        <label>Award: <input name="DoctorAward" value="{{ doctor.DoctorAward if doctor else '' }}"></label><br>
        <label>Award Year: <input name="DoctorAwardYear" value="{{ doctor.DoctorAwardYear if doctor else '' }}"></label><br>
        <label>Memberships: <input name="DoctorMemberships" value="{{ doctor.DoctorMemberships if doctor else '' }}"></label><br>
        <label>Registrations: <input name="DoctorRegistrations" value="{{ doctor.DoctorRegistrations if doctor else '' }}"></label><br>
        <label>Registration Year: <input name="DoctorRegistrationYear" value="{{ doctor.DoctorRegistrationYear if doctor else '' }}"></label><br>

        <button type="submit">Save</button>
    </form>
</body>
</html>
