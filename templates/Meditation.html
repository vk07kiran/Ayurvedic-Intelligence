						],
					},
					{
						name: "Yoga Nidra",
						image: "assets/img/YogaMedImages/yoga nidra.png",

							"Lie down in a comfortable position.",

							"Improves sleep, reduces insomnia, alleviates stress and PTSD.",
						],
					},
					{
						name: "Tonglen Meditation",

			};

			const displayMeditationContent = (meditationData) => {
				const meditationContainer = document.getElementById(
					"meditation-container"
				);
				meditationContainer.innerHTML = "";
				meditationData.forEach((meditation) => {
					const meditationCard = document.createElement("div");
					meditationCard.className = "bg-white shadow-md rounded-lg p-4 m-4";
					meditationCard.innerHTML = `
                    <h2 class="text-xl font-bold">${meditation.name}</h2>
                    <img src="${meditation.image}" alt="${
						meditation.name
					}" class="w-full h-48 object-contain bg-white rounded">
                    <h3 class="text-lg font-semibold mt-2">Steps:</h3>
                    <ol class="list-decimal ml-6">
                        ${meditation.steps
													.map((step) => `<li>${step}</li>`)
													.join("")}
                    </ol>
                    <h3 class="text-lg font-semibold mt-2">Benefits:</h3>
                    <ul class="list-disc ml-6">
                        ${meditation.benefits
													.map((benefit) => `<li>${benefit}</li>`)
													.join("")}
                    </ul>
                `;
					meditationContainer.appendChild(meditationCard);
				});
			};

			document.addEventListener("DOMContentLoaded", () => {
				displayMeditationContent(data.meditation);
			});
		</script>
	</body>
</html>
