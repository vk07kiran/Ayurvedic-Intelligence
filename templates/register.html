<head>
	<meta charset="utf-8">
	<title>Doccure</title>

	<!-- Bootstrap CSS -->

	<!-- Fontawesome CSS -->
	<link rel="stylesheet" href="assets/plugins/fontawesome/css/fontawesome.min.css">
	<link rel="stylesheet" href="assets/plugins/fontawesome/css/all.min.css">

	<!-- Main CSS -->
	<link rel="stylesheet" href="assets/css/style.css">


	<!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
	<!--[if lt IE 9]>
			<script src="assets/js/html5shiv.min.js"></script>
			<script src="assets/js/respond.min.js"></script>
		<![endif]-->

</head>

<body class="account-page">

	<!-- Main Wrapper -->
	<div class="main-wrapper">

<!-- Header -->
		<header class="header">
			<nav class="navbar navbar-expand-lg header-nav">
				<div class="navbar-header">
					<a id="mobile_btn" href="javascript:void(0);">
						<span class="bar-icon">
							<span></span>
							<span></span>
							<span></span>
						</span>
					</a>
					<a href="/homepage" class="navbar-brand logo">
						<img src="assets/img/AI_logo.png" class="img-fluid" alt="Logo" height="50px" width="50px">
					</a>
				</div>
				<div class="main-menu-wrapper">
					<div class="menu-header">
						<a href="/homepage" class="menu-logo">
							<img src="assets/img/logo.png" class="img-fluid" alt="Logo">
						</a>
						<a id="menu_close" class="menu-close" href="javascript:void(0);">
							<i class="fas fa-times"></i>
						</a>
					</div>
					<ul class="main-nav">
						<li>
							<a href="/homepage">Home</a>
						</li>
						
						 
						<li class="login-link">
							<a href="/login">Login</a>
						</li>
					</ul>
				</div>
				<ul class="nav header-navbar-rht">
					<li class="nav-item contact-item">
						<div class="header-contact-img">
							<i class="far fa-hospital"></i>
						</div>
						<div class="header-contact-detail">
							<p class="contact-header">Contact</p>
							<p class="contact-info-header"> +977 98 0045 5785</p>
						</div>
					</li>
					<li class="nav-item">
						<a class="nav-link header-login" href="/login">login</a>
					</li>
				</ul>
			</nav>
		</header>
		<!-- /Header -->



	 


		<!-- Page Content -->
		<div class="content">
			<div class="container-fluid">

				<div class="row">
					<div class="col-md-8 offset-md-2">

						<!-- Register Content -->
						<div class="account-content">
							<div class="row align-items-center justify-content-center">
								<div class="col-md-7 col-lg-6 login-left">
									<img src="assets/img/login-banner.png" class="img-fluid" alt="Doccure Register">
								</div>
								<div class="col-md-12 col-lg-6 login-right">


									<!-- Register Form -->
									<form action="{{ url_for('signup.signup') }}" method="POST">
										<div class="form-group form-focus">
											<input type="text" name="username" required class="form-control floating">
											<label class="focus-label">Username</label>
										</div>
										<div class="form-group form-focus">
											<input type="text" name="email" required class="form-control floating">
											<label class="focus-label">Email</label>
										</div>
										<div class="form-group form-focus">
											<input type="password" name="password" required
												class="form-control floating">
											<label class="focus-label">Create Password</label>
										</div>
										<div class="form-group form-focus">
											<input type="radio" id="patient" name="role" value="Patient" required checked >
											<label for="patient">I am a Patient</label>
											<br>
											<input type="radio" id="doctor" name="role" value="Doctor" required>
											<label for="doctor">I am a Doctor</label><br>
											
										</div>

										<div class="text-right">
											<a class="forgot-link" href="/login">Already have an account?</a>
										</div>
										<button class="btn btn-primary btn-block btn-lg login-btn"
											type="submit">Signup</button>
										 
										 
									</form>
									<!-- /Register Form -->

								</div>
							</div>
						</div>
						<!-- /Register Content -->

					</div>
				</div>

			</div>

		</div>
		<!-- /Page Content -->

		<!-- footer section starts  -->
		<style>
			.footerDoc .credits {

				font-size: 2rem;
				color: #000;
				border-top: .1rem solid rgba(0, 0, 0, .1);
			}


			.footerDoc .credits span {
				color: var(--Soft-Red);
				cursor: pointer;
			}
		</style>
		<section class="footerDoc" id="footerDoc">
			<div class="credits">Created by <span>Ayurvedic AI Team</span> | All rights reserved</div>
		</section>
